# ─── SonarQube Monorepo Configuration ───────────────────────────────────
# Money Card Project: Backend (Express/TS), Frontend (React/TS), Mobile (Flutter/Dart)

sonar.projectKey=Money-card-system
sonar.projectName=Money Card System
sonar.projectVersion=1.0.0
sonar.host.url=http://localhost:9000
sonar.token=sqp_27005c3adc9c36b55485b9daf1c87cd9778b7ba9
sonar.scm.disabled=true

# Encoding & Base Sources
sonar.sourceEncoding=UTF-8
sonar.sources=Backend Money Card/src,Frontend Money Card/src,Flutter Money card/lib
sonar.tests=Backend Money Card/test,Frontend Money Card/src/__tests__,Flutter Money card/test

# ─── Exclusions ────────────────────────────────────────────────────────
# Exclude build outputs, dependencies, generated code, and assets
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.dart_tool/**,\
  **/coverage/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/generated/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.dart,\
  **/*.json,\
  **/*.svg,\
  **/*.png,\
  **/*.ico

# ─── Test Inclusion Patterns ──────────────────────────────────────────
sonar.test.inclusions=\
  Backend Money Card/test/**/*.test.ts,\
  Frontend Money Card/src/__tests__/**/*.test.ts,\
  Flutter Money card/test/**/*_test.dart

# ─── Code Coverage Reports ────────────────────────────────────────────
# Backend & Frontend Vitest LCOV Coverage
sonar.javascript.lcov.reportPaths=\
  Backend Money Card/coverage/lcov.info,\
  Frontend Money Card/coverage/lcov.info

# Flutter / Dart LCOV Coverage (Used by sonar-flutter plugin)
sonar.dart.coverage.reportPath=Flutter Money card/coverage/lcov.info

# ─── TypeScript / Node Configuration ──────────────────────────────────
sonar.typescript.tsconfigPath=Backend Money Card/tsconfig.json
